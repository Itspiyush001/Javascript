<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="img/search (1).png" height="45px  "></button>

        </div>
        <div class="error">
            <P>Invalid city name</P>

        </div>
        <div class="weather">
            <img src="img/cloudy (2).png" class="weather-icon" height="130px">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
            <div class="details" >
                <div class="col">
                    <img src="img/weather (1).png" height="100px" >
                    <div>
                        <p class="humidity">50%</p>
                        <p>humidity</p>
                    </div>
                </div>
                    <div class="col" >
                        <img src="img/wind (1).png" height="90px">
                        <div>
                            <p class="wind">15  km/h</p>
                            <p>wind speed</p>
                        </div>

                    </div>
                </div>
            </div>
         </div>

         <script src="weather.js"></script>
</body>
</html>
