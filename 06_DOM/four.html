<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code </title>
</head>
<body style="background-color: black; color: aliceblue;">
   <ul class="language">
    <li>Javascript</li>
   </ul>
</body>
    <script>
        function addLanguage(langname){
        const li = document.createElement('li')
        li.innerHTML = `${langname}`
        document.querySelector('.language').appendChild(li);

        }
        addLanguage("Python");
        addLanguage("Golang");

       function addOptiLanguage(langname){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langname));
        document.querySelector('.language').appendChild(li)
       }
       addOptiLanguage("Typescript");

    //    edit
       const secondLanguage = document.querySelector("li:nth-child(2)")
    //    secondLanguage.innerHTML = "Java"
        const newli = document.createElement('li')
       newli.textContent = "java"
       secondLanguage.replaceWith(newli)

       //edit
       const firstlangauge = document.querySelector("li:first-child")
       firstlangauge.outerHTML = '<li>Typescript</li>'

       //remove
       const lastLang = document.querySelector('li:last-child')
       lastLang.remove();
    </script>
</html>
